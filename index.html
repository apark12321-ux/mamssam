  (function () {
    var el = document.getElementById('splash'), t0 = Date.now(), seen = false, ready = false, done = false;
    try { seen = sessionStorage.getItem('splashSeen') === '1'; sessionStorage.setItem('splashSeen', '1'); } catch (e) {}
    var min = seen ? 1200 : 4500;
    el.style.setProperty('--sd', min + 'ms');
    function hide() { if (done || !el) return; done = true; el.classList.add('out'); setTimeout(function () { el.remove(); }, 500); }
    function check() { if (ready && Date.now() - t0 >= min) hide(); }
    window.SplashCtl = { ready: function () { ready = true; setTimeout(check, Math.max(0, min - (Date.now() - t0))); }, hide: hide, min: min };
    setTimeout(function () { ready = true; check(); }, min + 3000); // 앱 준비 신호가 없더라도 최대 시간 뒤에는 닫기
  })();
